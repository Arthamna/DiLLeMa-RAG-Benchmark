[project]
name = "dillema-rankify-gpu-environment"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dillema-rankify-worker",
  "rankify[retriever,rag]==0.1.4",
  "bitsandbytes==0.50.2; platform_system == 'Linux'",
  "pyarrow==17.0.0",
  "chardet>=5,<6",
  "torch==2.13.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
dillema-rankify-worker = { path = "../src/rag_benchmark/techniques/rankify/worker" }
torch = { index = "pytorch-cu132" }
