[project]
name = "dillema-rank-zephyr-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "rank-llm[vllm]",
  "vllm==0.19.1",
  "bitsandbytes==0.49.2",
  "torch==2.10.0",
  "torchaudio==2.10.0",
  "torchvision==0.25.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
rank-llm = { git = "https://github.com/castorini/rank_llm", rev = "0fd5678ffc43488531ba26a42f367d42480a75ec" }
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
