dataset: its
# Relative paths are resolved from this YAML file.
source: ../../dataset/langchain-chatbot-main/dataset
index_root: ../../artifacts/indexes
rankify_python: ../../.venv-rankify/bin/python

generator:
  backend: openai-compatible
  model_env: LLM_MODEL
  base_url_env: LLM_BASE_URL
  api_key_env: LLM_API_KEY
  temperature: 0
  max_tokens: 768
  max_tokens_env: LLM_MAX_TOKENS
  quantization: 4bit
  max_input_tokens: 4096

models:
  dense_multilingual: BAAI/bge-m3
  reranker_multilingual: BAAI/bge-reranker-v2-m3

retrieval:
  candidates: 40
  top_k: 10
  rrf_k: 60

presets:
  - rankify_bm25_basic
  - rankify_bge_basic
  - rankify_bm25_bge_rerank_basic
  - rankify_bge_bge_rerank_basic
  - rankify_hybrid_bge_rerank_basic
  - rankify_hybrid_bge_rerank_cot
  - rankify_hybrid_bge_rerank_incontext
