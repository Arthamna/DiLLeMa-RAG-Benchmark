dataset: its
# Relative paths are resolved from this YAML file.
source: ../../dataset/langchain-chatbot-main/dataset
index_root: ../../artifacts/indexes
rankify_python: ../../.venv-rankify-gpu/bin/python

evaluation:
  split: all

generator:
  backend: huggingface
  model_env: HF_MODEL_NAME
  temperature: 0
  max_tokens: 768
  max_tokens_env: HF_MAX_NEW_TOKENS
  quantization: 4bit
  quantization_env: HF_QUANTIZATION
  trust_remote_code: false
  max_input_tokens: 4096
  max_input_tokens_env: HF_MAX_INPUT_TOKENS

models:
  dense_multilingual: BAAI/bge-m3
  reranker_multilingual: BAAI/bge-reranker-v2-m3

retrieval:
  candidates: 100
  top_k: 10
  rrf_k: 60

qwen3:
  enabled: true
  embedding_model: Qwen/Qwen3-Embedding-0.6B
  reranker_model: Qwen/Qwen3-Reranker-4B
  instruction: Given a question, retrieve relevant passages that answer the question.
  embedding_dimension: 1024
  embedding_max_length: 2048
  reranker_max_length: 2048
  embedding_batch_size: 8
  reranker_batch_size: 1
  torch_dtype: bfloat16
  reranker_quantization: none
  attention_implementation: sdpa

presets:
  - rankify_bm25_basic
  - rankify_bge_basic
  - rankify_bm25_bge_rerank_basic
  - rankify_bge_bge_rerank_basic
  - rankify_hybrid_bge_rerank_basic
  - rankify_hybrid_bge_rerank_cot
  - rankify_hybrid_bge_rerank_incontext
